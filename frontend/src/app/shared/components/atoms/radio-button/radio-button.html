<label
  class="radio"
  [class.radio--disabled]="disabled()"
  [for]="id()"
>
  <input
    class="radio__input"
    type="radio"
    [id]="id()"
    [name]="name()"
    [value]="value()"
    [checked]="checked()"
    [disabled]="disabled()"
    [required]="required()"
    (change)="onChange($event)"
  />

  <span class="radio__circle" aria-hidden="true">
    <span class="radio__indicator"></span>
  </span>

  <span class="radio__content">
    @if (label()) {
      <span class="radio__label">{{ label() }}</span>
    }

    @if (description()) {
      <span class="radio__description">
        {{ description() }}
      </span>
    }
  </span>
</label>
