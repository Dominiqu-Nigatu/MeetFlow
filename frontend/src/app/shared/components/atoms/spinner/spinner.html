
<div
  class="spinner-container"
  role="status"
  [attr.aria-label]="message() || 'Loading'"
>
  <span
    class="spinner"
    [class.spinner--sm]="size() === 'sm'"
    [class.spinner--md]="size() === 'md'"
    [class.spinner--lg]="size() === 'lg'"
    aria-hidden="true"
  ></span>

  @if (message()) {
    <span class="spinner__message">
      {{ message() }}
    </span>
  }
</div>
