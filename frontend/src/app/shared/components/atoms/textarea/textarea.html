<div class="textarea-field">
  @if (label()) {
    <label class="textarea-field__label" [for]="id()">
      {{ label() }}

      @if (required()) {
        <span class="textarea-field__required">*</span>
      }
    </label>
  }

  <textarea
    class="textarea-field__control"
    [id]="id()"
    [placeholder]="placeholder()"
    [value]="value()"
    [rows]="rows()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.maxlength]="maxLength()"
    [attr.minlength]="minLength()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="
      error() ? id() + '-error' :
      hint() ? id() + '-hint' : null
    "
    (input)="onInput($event)"
  ></textarea>

  <div class="textarea-field__footer">
    @if (error()) {
      <span
        class="textarea-field__message textarea-field__message--error"
        [id]="id() + '-error'"
      >
        {{ error() }}
      </span>
    } @else if (hint()) {
      <span
        class="textarea-field__message"
        [id]="id() + '-hint'"
      >
        {{ hint() }}
      </span>
    }

    @if (maxLength()) {
      <span class="textarea-field__counter">
        {{ value().length }} / {{ maxLength() }}
      </span>
    }
  </div>
</div>
