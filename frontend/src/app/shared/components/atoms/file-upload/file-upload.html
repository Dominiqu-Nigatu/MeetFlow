<div class="file-upload">
  <span class="file-upload__label">{{ label() }}</span>

  @if (!selectedFile()) {
    <label
      class="file-upload__dropzone"
      [class.file-upload__dropzone--dragging]="isDragging()"
      [class.file-upload__dropzone--disabled]="disabled()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <input
        class="file-upload__input"
        type="file"
        [accept]="accept()"
        [disabled]="disabled()"
        (change)="onFileInput($event)"
      />

      <span class="file-upload__icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 16V4" />
          <path d="m7 9 5-5 5 5" />
          <path d="M20 16.5v2A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5v-2" />
        </svg>
      </span>

      <span class="file-upload__title"> Drop your file here </span>

      <span class="file-upload__browse"> Browse files </span>

      <span class="file-upload__hint">
        {{ hint() }}
      </span>

      <span class="file-upload__formats"> {{ accept() }} · Up to {{ maxSizeMB() }} MB </span>
    </label>
  } @else {
    <div class="file-upload__selected">
      <div class="file-upload__file-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <path d="M14 2v6h6" />
          <path d="M8 13h8M8 17h8" />
        </svg>
      </div>

      <div class="file-upload__file-info">
        <span class="file-upload__file-name">
          {{ selectedFile()!.name }}
        </span>

        <span class="file-upload__file-size">
          {{ formatFileSize(selectedFile()!.size) }}
        </span>
      </div>

      <button
        class="file-upload__remove"
        type="button"
        aria-label="Remove selected file"
        [disabled]="disabled()"
        (click)="removeFile()"
      >
        &times;
      </button>
    </div>
  }

  @if (errorMessage()) {
    <span class="file-upload__error" role="alert">
      {{ errorMessage() }}
    </span>
  }
</div>
