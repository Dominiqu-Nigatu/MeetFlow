<div
  class="file-upload"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <label class="file-upload__label">
    {{ label() }}
    <input type="file" [accept]="accept()" [disabled]="disabled()" (change)="onFileInput($event)" />
  </label>
  <span class="file-upload__formats">TXT, VTT or MD · Up to {{ maxSizeMB() }} MB</span>
  @if (selectedFile()) {
    <div class="file-upload__selected">
      <span class="file-upload__file-name">{{ selectedFile()!.name }}</span>
      <button type="button" [disabled]="disabled()" (click)="removeFile()">Clear file</button>
    </div>
  }
  @if (errorMessage()) {
    <span class="file-upload__error" role="alert">{{ errorMessage() }}</span>
  }
</div>
