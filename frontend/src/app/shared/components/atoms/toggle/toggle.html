
<label
  class="toggle"
  [class.toggle--disabled]="disabled()"
  [for]="id()"
>
  <span class="toggle__content">
    @if (label()) {
      <span class="toggle__label">{{ label() }}</span>
    }

    @if (description()) {
      <span class="toggle__description">{{ description() }}</span>
    }
  </span>

  <span class="toggle__switch">
    <input
      class="toggle__input"
      type="checkbox"
      role="switch"
      [id]="id()"
      [checked]="checked()"
      [disabled]="disabled()"
      [attr.aria-label]="label() || id()"
      (change)="onChange($event)"
    />

    <span class="toggle__track" aria-hidden="true">
      <span class="toggle__thumb"></span>
    </span>
  </span>
</label>
