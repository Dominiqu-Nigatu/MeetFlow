
<div class="select">
  @if (label()) {
    <label class="select__label" [for]="id()">
      {{ label() }}

      @if (required()) {
        <span class="select__required">*</span>
      }
    </label>
  }

  <div
    class="select__wrapper"
    [class.select__wrapper--error]="!!error()"
  >
    <select
      class="select__control"
      [id]="id()"
      [value]="value()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="error() ? id() + '-error' : hint() ? id() + '-hint' : null"
      (change)="onChange($event)"
    >
      <option value="" disabled>
        {{ placeholder() }}
      </option>

      @for (option of options(); track option.value) {
        <option
          [value]="option.value"
          [disabled]="option.disabled ?? false"
        >
          {{ option.label }}
        </option>
      }
    </select>

    <svg class="select__icon" viewBox="0 0 24 24" fill="none">
      <path
        d="m6 9 6 6 6-6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  @if (error()) {
    <span class="select__message select__message--error" [id]="id() + '-error'">
      {{ error() }}
    </span>
  } @else if (hint()) {
    <span class="select__message" [id]="id() + '-hint'">
      {{ hint() }}
    </span>
  }
</div>
