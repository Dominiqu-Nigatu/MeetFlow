<form class="search-bar" (submit)="onSubmit($event)">
  <div class="search-bar__input">
    <app-input
      id="meeting-search"
      [label]="showLabel() ? 'Search' : ''"
      type="search"
      [placeholder]="placeholder()"
      [value]="query()"
      [disabled]="disabled()"
      (valueChange)="onValueChange($event)"
    />
  </div>
</form>
