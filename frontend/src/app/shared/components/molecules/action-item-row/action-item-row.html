<article class="action-item" [class.action-item--completed]="completed()">
  <div class="action-item__checkbox">
    <app-checkbox
      [id]="id()"
      [checked]="completed()"
      [label]="description()"
      (checkedChange)="onCompletedChange($event)"
    />
  </div>

  <app-badge
    [label]="completed() ? 'Completed' : 'Open'"
    [variant]="completed() ? 'success' : 'warning'"
    size="sm"
  />
</article>
