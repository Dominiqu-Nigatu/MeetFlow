<div class="form-field">
  <app-input
    [id]="id()"
    [label]="label()"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [hint]="hint()"
    [error]="error()"
    [required]="required()"
    [disabled]="disabled()"
    (valueChange)="onValueChange($event)"
  />
</div>
