<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <div class="sidebar__header">
    <div class="sidebar__brand">
      <div class="sidebar__logo">M</div>

      @if (!collapsed()) {
        <div class="sidebar__brand-text">
          <span class="sidebar__brand-name">MeetFlow</span>
          <span class="sidebar__brand-tagline">Summarise. Organise.</span>
        </div>
      }
    </div>

    <button type="button" class="sidebar__close" aria-label="Close sidebar" (click)="onClose()">
      ×
    </button>
  </div>

  <div class="sidebar__navigation">
    @if (!collapsed()) {
      <span class="sidebar__section-label">MENU</span>
    }

    <nav>
      @for (item of navigationItems(); track item.path) {
        <a
          class="sidebar__link"
          [routerLink]="item.path"
          routerLinkActive="sidebar__link--active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          [title]="collapsed() ? item.label : ''"
          (click)="onNavigationSelected(item)"
        >
          <span class="sidebar__link-icon">{{ item.icon }}</span>

          @if (!collapsed()) {
            <span class="sidebar__link-label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>
  </div>

</aside>
