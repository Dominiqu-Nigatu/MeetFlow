<header class="navbar">
  <div class="navbar__left">
    <button
      class="navbar__menu-button"
      type="button"
      aria-label="Toggle navigation"
      (click)="onMenuClick()"
    >
      ☰
    </button>

    <h1 class="navbar__title">{{ pageTitle() }}</h1>
  </div>

  <div class="navbar__right">
    @if (showSearch()) {
      <div class="navbar__search">
        <app-search-bar
          placeholder="Search meetings..."
          [showLabel]="false"
          (search)="onSearch($event)"
        />
      </div>
    }

    <button
      class="navbar__notification"
      type="button"
      aria-label="Notifications"
      (click)="onNotificationClick()"
    >
      ♧
      <span class="navbar__notification-dot"></span>
    </button>

    <button
      class="navbar__profile"
      type="button"
      (click)="onProfileClick()"
    >
      <app-avatar
        [name]="userName()"
        [src]="avatarSrc()"
        size="md"
      />

      <span class="navbar__user-details">
        <span class="navbar__user-name">{{ userName() }}</span>
        <span class="navbar__user-role">{{ userRole() }}</span>
      </span>

      <span class="navbar__profile-arrow">⌄</span>
    </button>
  </div>
</header>
