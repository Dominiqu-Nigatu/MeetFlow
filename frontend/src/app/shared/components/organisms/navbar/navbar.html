<header class="navbar">
  <div class="navbar__left">
    <button
      class="navbar__menu-button"
      type="button"
      aria-label="Toggle navigation"
      (click)="onMenuClick()"
    >
      ☰
    </button>

    <h1 class="navbar__title">{{ pageTitle() }}</h1>
  </div>

  <div class="navbar__right">
    @if (showSearch()) {
      <div class="navbar__search">
        <app-search-bar
          [placeholder]="searchPlaceholder()"
          [showLabel]="false"
          [initialValue]="searchQuery()"
          (search)="onSearch($event)"
        />
      </div>
    }

    <button class="navbar__profile" type="button" (click)="onProfileClick()">
      <app-avatar [name]="userName()" [src]="avatarSrc()" size="md" />

      <span class="navbar__user-details">
        <span class="navbar__user-name">{{ userName() }}</span>
      </span>
    </button>
  </div>
</header>
