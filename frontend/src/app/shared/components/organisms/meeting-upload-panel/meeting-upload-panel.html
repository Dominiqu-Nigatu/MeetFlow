<section class="upload-panel">
  <header class="panel-header"><h2>Add a meeting transcript</h2></header>
  <form class="upload-form" (submit)="onSubmit($event)" [attr.aria-busy]="saving()">
    <app-input
      [id]="formId + '-title'"
      label="Meeting title"
      [value]="title()"
      [required]="true"
      [disabled]="saving()"
      (valueChange)="onTitleChange($event)"
    />
    <app-input
      [id]="formId + '-date'"
      label="Meeting date"
      type="date"
      [value]="meetingDate()"
      [disabled]="saving()"
      (valueChange)="meetingDate.set($event)"
    />
    <fieldset [disabled]="saving()">
      <legend>Transcript source</legend>
      <label
        ><input
          type="radio"
          [name]="formId + '-source'"
          [checked]="mode() === 'file'"
          (change)="setMode('file')"
        />
        Upload file</label
      >
      <label
        ><input
          type="radio"
          [name]="formId + '-source'"
          [checked]="mode() === 'text'"
          (change)="setMode('text')"
        />
        Paste text</label
      >
    </fieldset>
    <div [hidden]="mode() !== 'file'">
      <app-file-upload
        label="Transcript file"
        accept=".txt,.vtt,.md"
        [maxSizeMB]="10"
        [disabled]="saving()"
        (fileSelected)="onFileSelected($event)"
        (fileRemoved)="onFileRemoved()"
        (validationError)="onValidationError($event)"
      />
    </div>
    @if (mode() === 'text') {
      <div class="text-field">
        <label [for]="formId + '-text'">Transcript text</label>
        <textarea
          [id]="formId + '-text'"
          rows="10"
          [value]="transcriptText()"
          [disabled]="saving()"
          (input)="transcriptText.set($any($event.target).value)"
        ></textarea>
      </div>
    }
    @if (successMessage()) {
      <p class="upload-success" role="status">{{ successMessage() }}</p>
    }
    @if (errorMessage()) {
      <p class="upload-error" role="alert">{{ errorMessage() }}</p>
    }
    <div class="form-footer">
      <app-button
        [label]="saving() ? 'Saving…' : 'Save meeting'"
        [loading]="saving()"
        type="submit"
        [disabled]="saving() || !canSubmit()"
      />
    </div>
  </form>
</section>
