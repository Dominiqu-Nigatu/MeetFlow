<app-auth-layout>
  <div class="login-container">
    <div class="login-header">
      <h1>Sign in to <span>MeetFlow</span></h1>
    </div>

    @if (localAccountDeleted) {
      <p role="status">
        Local workspace account marked deleted. Meetings are unchanged. No server account was
        deleted.
      </p>
    }
    <form novalidate class="login-form" (submit)="$event.preventDefault(); onSubmit()">
      <app-input
        id="email"
        label="Email address"
        type="email"
        placeholder="you@example.com"
        [value]="email()"
        [error]="fieldError('email')"
        [disabled]="submitting()"
        (focusout)="touch('email')"
        [required]="true"
        (valueChange)="onEmailChange($event)"
      />

      <div class="password-field">
        <app-input
          id="password"
          label="Password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Enter your password"
          [value]="password()"
          [error]="fieldError('password')"
          [disabled]="submitting()"
          (focusout)="touch('password')"
          [required]="true"
          (valueChange)="onPasswordChange($event)"
        />

        <button
          class="password-toggle"
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>

      @if (errorMessage()) {
        <div class="error-message" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <app-button
        label="Sign in"
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [disabled]="submitting()"
        [loading]="submitting()"
      />
    </form>

    <div class="signup-prompt">
      <p>
        Don't have an account?
        <a routerLink="/register">Create an account</a>
      </p>
    </div>

    <a class="dashboard-preview" routerLink="/dashboard">Go to dashboard</a>
  </div>
</app-auth-layout>
