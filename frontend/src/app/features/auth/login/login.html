<app-auth-layout>
  <div class="login-container">
    <div class="login-header">
      <div class="mobile-brand">
        <div class="brand-icon">M</div>
        <span>MeetFlow</span>
      </div>

      <div class="welcome-badge">
        <span class="badge-dot"></span>
        Welcome back
      </div>

      <h1>Sign in to <span>MeetFlow</span></h1>

      <p class="login-subtitle">Your meetings, notes and action items, all in one place.</p>
    </div>

    <form class="login-form" (submit)="$event.preventDefault(); onSubmit()">
      <app-input
        id="email"
        label="Email address"
        type="email"
        placeholder="you@example.com"
        [value]="email()"
        [required]="true"
        (valueChange)="onEmailChange($event)"
      />

      <div class="password-field">
        <app-input
          id="password"
          label="Password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Enter your password"
          [value]="password()"
          [required]="true"
          (valueChange)="onPasswordChange($event)"
        />

        <button
          class="password-toggle"
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>

      <div class="form-options">
        <app-checkbox
          id="remember-me"
          label="Remember me"
          [checked]="rememberMe()"
          (checkedChange)="onRememberMeChange($event)"
        />

        <a href="#" class="forgot-password" (click)="$event.preventDefault()"> Forgot password? </a>
      </div>

      @if (errorMessage()) {
        <div class="error-message" role="alert">
          <span class="error-icon">!</span>
          {{ errorMessage() }}
        </div>
      }

      <app-button label="Sign in" type="submit" variant="primary" size="lg" [fullWidth]="true" />
    </form>

    <div class="login-divider">
      <span>or</span>
    </div>

    <div class="signup-prompt">
      <p>
        Don't have an account?
        <a href="#" (click)="$event.preventDefault()">Create an account</a>
      </p>
    </div>

    <div class="security-note">
      <span class="security-icon">✦</span>
      <span>Your workspace is private and secure.</span>
    </div>
  </div>
</app-auth-layout>
