<app-auth-layout>
  <div class="register-container">
    <div class="register-header">
      <h1>Create your <span>account</span></h1>
    </div>

    <form novalidate class="register-form" (submit)="$event.preventDefault(); onSubmit()">
      <app-input
        id="full-name"
        label="Full name"
        type="text"
        placeholder="John Doe"
        [value]="fullName()"
        [error]="fieldError('fullName')"
        [disabled]="submitting()"
        (focusout)="touch('fullName')"
        [required]="true"
        (valueChange)="onFullNameChange($event)"
      />

      <app-input
        id="register-email"
        label="Email address"
        type="email"
        placeholder="you@example.com"
        [value]="email()"
        [error]="fieldError('email')"
        [disabled]="submitting()"
        (focusout)="touch('email')"
        [required]="true"
        (valueChange)="onEmailChange($event)"
      />

      <div class="password-field">
        <app-input
          id="register-password"
          label="Password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="At least 8 characters"
          [value]="password()"
          [error]="fieldError('password')"
          [disabled]="submitting()"
          (focusout)="touch('password')"
          [required]="true"
          (valueChange)="onPasswordChange($event)"
        />

        <button
          class="password-toggle"
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>

      <div class="password-field">
        <app-input
          id="confirm-password"
          label="Confirm password"
          [type]="showConfirmPassword() ? 'text' : 'password'"
          placeholder="Enter your password again"
          [value]="confirmPassword()"
          [error]="fieldError('confirmPassword')"
          [disabled]="submitting()"
          (focusout)="touch('confirmPassword')"
          [required]="true"
          (valueChange)="onConfirmPasswordChange($event)"
        />

        <button
          class="password-toggle"
          type="button"
          (click)="toggleConfirmPasswordVisibility()"
          [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'"
        >
          {{ showConfirmPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>

      @if (errorMessage()) {
        <div class="error-message" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <app-button
        label="Register"
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [disabled]="submitting()"
        [loading]="submitting()"
      />
    </form>

    <div class="signin-prompt">
      <p>
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </p>
    </div>

    <a class="dashboard-preview" routerLink="/dashboard">Go to dashboard</a>
  </div>
</app-auth-layout>
